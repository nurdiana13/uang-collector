<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pengumpulan Data Uang Kertas</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1f2430;--mut:#6b7280;--bd:#e3e7ef;--pri:#2563eb;--ok:#16a34a;--err:#dc2626;--warn:#92400e;--warnbg:#fef3c7;--bar:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#181c2e;--tx:#e8eaf3;--mut:#9aa3b8;--bd:#2a3050;--pri:#6b9bff;--ok:#16a34a;--err:#dc2626;--warn:#fcd34d;--warnbg:#3b2f0b;--bar:#2a3050}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif}
header{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;padding:28px 16px 44px;text-align:center}
header h1{margin:0;font-size:22px}header p{margin:6px 0 0;opacity:.9;font-size:14px}
main{max-width:560px;margin:-26px auto 40px;padding:0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.card h2{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;font-size:13px}
label{display:block;margin:10px 0 4px;font-size:13px;font-weight:600;color:var(--mut)}
input[type=text],input[type=password]{width:100%;padding:11px 12px;font-size:16px;border:1.5px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx);transition:border-color .2s,box-shadow .2s}
input:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,99,235,.25)}
.row{display:flex;gap:10px}.row>div{flex:1}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--tx);font-weight:400;margin:0 0 6px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{padding:12px 4px;border:2px solid var(--bd);border-radius:12px;background:transparent;color:var(--tx);font-weight:700;font-size:14px;cursor:pointer;transition:transform .15s,background .2s,border-color .2s}
.chip:active{transform:scale(.94)}.chip.on{color:#fff;border-color:transparent;background:var(--c);transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.2)}
.seg{display:flex;background:var(--bar);border-radius:12px;padding:4px}
.seg button{flex:1;padding:10px;border:0;border-radius:9px;background:transparent;color:var(--mut);font-weight:600;font-size:15px;cursor:pointer;transition:.2s}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 5px rgba(0,0,0,.2)}
#hint{font-size:13px;color:var(--mut);margin:6px 2px 0}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.6}.btn.sec{background:var(--bar);color:var(--tx)}
.hidden{display:none!important}
#cam{position:relative;background:#000;border-radius:14px;overflow:hidden}
video,#preview{width:100%;display:block;border-radius:14px}
#frame{position:absolute;left:8%;right:8%;top:50%;aspect-ratio:2.2/1;transform:translateY(-50%);border:3px dashed #fff;border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.5);pointer-events:none;animation:pulse 2s infinite}
@keyframes pulse{50%{border-color:rgba(255,255,255,.35)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:fl .35s}@keyframes fl{from{opacity:.9}to{opacity:0}}
.shutter{display:block;margin:12px auto 0;width:68px;height:68px;border-radius:50%;border:5px solid var(--pri);background:transparent;position:relative;cursor:pointer}
.shutter::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--pri);transition:transform .15s}.shutter:active::after{transform:scale(.8)}
#warn{margin-top:10px;padding:12px;border-radius:12px;background:var(--warnbg);color:var(--warn);font-size:14px;animation:pop .3s}
@keyframes pop{from{transform:scale(.96);opacity:0}}
#warn button{margin-top:8px;padding:8px 12px;border:0;border-radius:8px;background:var(--warn);color:var(--warnbg);font-weight:700;cursor:pointer}
#score{font-size:12px;color:var(--mut);margin-top:6px}
.total{display:flex;justify-content:space-between;font-size:14px;color:var(--mut)}
.bar{height:8px;background:var(--bar);border-radius:99px;overflow:hidden;margin:3px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--c,var(--pri));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.prow{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:center;margin:10px 0}
.pn{font-weight:700;font-size:12px;color:#fff;border-radius:8px;padding:5px 0;text-align:center;background:var(--c)}
.prow small{display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,140px);padding:12px 18px;border-radius:12px;color:#fff;font-weight:600;transition:transform .35s;z-index:9;max-width:90%;text-align:center}
#toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<header><h1>💵 Pengumpulan Data Uang Kertas</h1><p>Proyek Pengenalan Pola · foto hanya untuk keperluan tugas kuliah</p></header>
<main>

<div class="card">
  <h2><span class="step">1</span>Identitas</h2>
  <label class="chk"><input type="checkbox" id="consent">Saya setuju foto ini dipakai untuk tugas mata kuliah Pengenalan Pola.</label>
  <label>Kode akses (dari tim)</label><input id="code" type="password" autocomplete="off">
  <div class="row">
    <div><label>Kode kontributor</label><input id="kontrib" type="text" placeholder="U01" maxlength="10"></div>
    <div><label>ID lembar (1 lembar fisik = 1 ID)</label><input id="lembar" type="text" placeholder="L1" maxlength="10"></div>
  </div>
</div>

<div class="card">
  <h2><span class="step">2</span>Pilih uang</h2>
  <div class="chips" id="nominal"></div>
  <label>Sisi</label>
  <div class="seg" id="sisi"><button data-v="depan">Depan</button><button data-v="belakang">Belakang</button></div>
  <label>Kondisi</label>
  <div class="seg" id="kondisi"><button data-v="baru">✨ Baru</button><button data-v="lusuh">🧻 Lusuh</button></div>
  <div id="hint"></div>
</div>

<div class="card">
  <h2><span class="step">3</span>Foto</h2>
  <small style="color:var(--mut)">Latar polos, cahaya merata, kamera tegak lurus. Pas-kan uang di dalam bingkai.</small>
  <div id="cam" class="hidden"><video id="video" playsinline muted></video><div id="frame"></div><div id="flash"></div></div>
  <img id="preview" class="hidden" alt="pratinjau"><canvas id="canvas" class="hidden"></canvas>
  <button class="shutter hidden" id="btnShot" aria-label="Jepret"></button>
  <button class="btn" id="btnCam">📷 Buka kamera</button>
  <div id="warn" class="hidden"></div><div id="score"></div>
  <button class="btn hidden" id="btnSave">✅ Simpan foto</button>
  <button class="btn sec hidden" id="btnRetry">Ulangi</button>
  <label>atau pilih dari galeri / kamera bawaan HP</label>
  <input id="file" type="file" accept="image/*" capture="environment">
</div>

<div class="card">
  <h2><span class="step">4</span>Progres tim</h2>
  <div class="total"><span>Total terkumpul</span><b id="totalTxt">-</b></div>
  <div class="bar"><i id="totalBar"></i></div>
  <div id="progress"></div>
</div>
</main>
<div id="toast"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycby8ANBIkD8HPb_kU_OWm_CwiHeVRFzvTRPCvzceep4cNxgQnd7Srlf3KdNDxDA5gQD-/exec";
const TARGET = 50;                    // target foto per kelas (nominal + sisi)
const WEAR_LOW = 0.08, WEAR_HIGH = 0.14;   // ambang peringatan kondisi (perlu dikalibrasi, lihat catatan)
const NOMINAL = {2000:"#9ca3af",5000:"#a1887f",10000:"#8b5cf6",20000:"#22c55e",50000:"#3b82f6",100000:"#ef4444"};
const HINT = {baru:"Baru: tanpa lipatan, warna cerah, sudut tajam, tanpa noda/coretan.",
              lusuh:"Lusuh: ada lipatan/kusut, warna kusam, sudut tumpul, ada noda atau coretan."};
const $ = id => document.getElementById(id);
const st = {nominal:"5000", sisi:"depan", kondisi:"baru"};
let stream = null, imgB64 = null, score = null, warnOn = false;

// ---------- pilihan interaktif ----------
Object.entries(NOMINAL).forEach(([n, c]) => {
  const b = document.createElement("button");
  b.className = "chip"; b.dataset.v = n; b.style.setProperty("--c", c);
  b.textContent = "Rp" + Number(n).toLocaleString("id-ID"); $("nominal").append(b);
});
function bind(id, key) {
  const root = $(id);
  const sync = () => root.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === st[key]));
  root.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    st[key] = b.dataset.v; sync();
    if (key === "kondisi") { $("hint").textContent = HINT[st.kondisi]; judge(); }
  };
  sync();
}
bind("nominal", "nominal"); bind("sisi", "sisi"); bind("kondisi", "kondisi");
$("hint").textContent = HINT.baru;

const clean = s => s.toUpperCase().replace(/[^A-Z0-9]/g, "");
const show = (id, on) => $(id).classList.toggle("hidden", !on);
function toast(t, ok) {
  const el = $("toast"); el.textContent = t; el.style.background = ok ? "var(--ok)" : "var(--err)";
  el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 3200);
}
function ident() {
  const p = {code: $("code").value, kontributor: clean($("kontrib").value), lembar: clean($("lembar").value)};
  if (!$("consent").checked) return toast("Centang persetujuan dulu.") || null;
  if (!p.code || !p.kontributor || !p.lembar) return toast("Isi kode akses, kode kontributor, dan ID lembar.") || null;
  return p;
}

// ---------- deteksi kondisi (heuristik) ----------
// skor = detail halus / kontras. Uang mulus & tajam -> skor tinggi; lusuh/kusam/buram -> rendah.
function wearScore(src) {
  const sw = src.width, sh = src.height;
  let cw = sw * .84, ch = cw / 2.2; if (ch > sh * .9) { ch = sh * .9; cw = ch * 2.2; }
  const W = 480, H = Math.round(W * ch / cw);
  const a = document.createElement("canvas"); a.width = W; a.height = H;
  const x = a.getContext("2d", {willReadFrequently: true});
  x.drawImage(src, (sw - cw) / 2, (sh - ch) / 2, cw, ch, 0, 0, W, H);
  const s = document.createElement("canvas"); s.width = W / 3 | 0; s.height = H / 3 | 0;
  s.getContext("2d").drawImage(a, 0, 0, s.width, s.height);
  const b = document.createElement("canvas"); b.width = W; b.height = H;
  const y = b.getContext("2d", {willReadFrequently: true}); y.drawImage(s, 0, 0, W, H);
  const p = x.getImageData(0, 0, W, H).data, q = y.getImageData(0, 0, W, H).data;
  let sum = 0, sq = 0, d = 0; const n = W * H;
  for (let i = 0; i < p.length; i += 4) {
    const g = .299 * p[i] + .587 * p[i+1] + .114 * p[i+2], h = .299 * q[i] + .587 * q[i+1] + .114 * q[i+2];
    sum += g; sq += g * g; d += Math.abs(g - h);
  }
  const m = sum / n, sd = Math.sqrt(Math.max(sq / n - m * m, 1e-6));
  return (d / n) / sd;
}
function judge() {
  const w = $("warn"); warnOn = false;
  if (score == null) { w.classList.add("hidden"); $("score").textContent = ""; return; }
  $("score").textContent = `Skor detail: ${score.toFixed(3)} (terlihat lusuh < ${WEAR_LOW}, terlihat mulus > ${WEAR_HIGH})`;
  let t = null, fix = null;
  if (st.kondisi === "baru" && score < WEAR_LOW) { t = "Foto ini terlihat seperti uang lusuh (atau fotonya kurang tajam), tapi kondisi yang dipilih Baru."; fix = "lusuh"; }
  if (st.kondisi === "lusuh" && score > WEAR_HIGH) { t = "Foto ini terlihat masih mulus dan tajam, tapi kondisi yang dipilih Lusuh."; fix = "baru"; }
  if (!t) { w.classList.add("hidden"); return; }
  warnOn = true; w.classList.remove("hidden");
  w.innerHTML = "⚠️ " + t + "<br><button id='fixBtn'>Ubah ke " + fix + "</button>";
  $("fixBtn").onclick = () => { st.kondisi = fix; bind("kondisi", "kondisi"); $("hint").textContent = HINT[fix]; judge(); };
}

// ---------- kamera & foto ----------
function stopCam() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; }
function setPhoto(source, w, h) {
  const k = Math.min(1, 1600 / Math.max(w, h)), c = $("canvas");
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext("2d").drawImage(source, 0, 0, c.width, c.height);
  const url = c.toDataURL("image/jpeg", 0.9);
  imgB64 = url.split(",")[1]; $("preview").src = url;
  score = wearScore(c); judge(); stopCam();
  show("cam", false); show("btnShot", false); show("btnCam", false);
  show("preview", true); show("btnSave", true); show("btnRetry", true);
}
$("btnCam").onclick = async () => {
  if (!ident()) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: "environment"}, width: {ideal: 1920}}, audio: false});
    $("video").srcObject = stream; await $("video").play();
    show("cam", true); show("btnShot", true); show("btnCam", false);
  } catch (e) { toast("Kamera tidak bisa dibuka (butuh HTTPS & izin). Pakai tombol galeri."); }
};
$("btnShot").onclick = () => {
  const f = $("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  const v = $("video"); setPhoto(v, v.videoWidth, v.videoHeight);
};
$("file").onchange = e => {
  const f = e.target.files[0]; if (!f || !ident()) { e.target.value = ""; return; }
  const img = new Image();
  img.onload = () => { setPhoto(img, img.naturalWidth, img.naturalHeight); URL.revokeObjectURL(img.src); };
  img.src = URL.createObjectURL(f);
};
function retry() {
  imgB64 = null; score = null; judge(); $("file").value = "";
  show("preview", false); show("btnSave", false); show("btnRetry", false); show("btnCam", true);
}
$("btnRetry").onclick = retry;

$("btnSave").onclick = async () => {
  const id = ident(); if (!id) return;
  if (warnOn && !confirm("Foto ini sepertinya tidak sesuai dengan kondisi yang dipilih. Tetap simpan?")) return;
  if (API_URL.startsWith("PASTE")) return toast("API_URL belum diisi di index.html.");
  const p = {...id, nominal: st.nominal, sisi: st.sisi, kondisi: st.kondisi, image: imgB64,
             skor: score == null ? null : Number(score.toFixed(4))};
  $("btnSave").disabled = true; $("btnSave").textContent = "Mengirim...";
  try {
    const r = await (await fetch(API_URL, {method: "POST", body: JSON.stringify(p)})).json();
    if (!r.ok) throw new Error(r.error);
    toast("Tersimpan ✓ " + r.name, true); retry(); loadProgress();
  } catch (e) { toast("Gagal: " + e.message); }
  $("btnSave").disabled = false; $("btnSave").textContent = "✅ Simpan foto";
};

// ---------- progres ----------
async function loadProgress() {
  if (API_URL.startsWith("PASTE")) { $("progress").textContent = "-"; return; }
  try {
    const {counts} = await (await fetch(API_URL)).json();
    let total = 0;
    $("progress").innerHTML = Object.entries(NOMINAL).map(([n, c]) => {
      const row = s => { const v = counts[n + "_" + s] || 0; total += v;
        return `<small><span>${s}</span><span>${v}/${TARGET}</span></small><div class="bar"><i data-w="${Math.min(100, v / TARGET * 100)}" style="--c:${c}"></i></div>`; };
      return `<div class="prow"><div class="pn" style="--c:${c}">Rp${Number(n).toLocaleString("id-ID")}</div><div>${row("depan")}${row("belakang")}</div></div>`;
    }).join("");
    const max = Object.keys(NOMINAL).length * 2 * TARGET;
    $("totalTxt").textContent = `${total} / ${max}`; $("totalBar").dataset.w = Math.min(100, total / max * 100);
    setTimeout(() => document.querySelectorAll(".bar i").forEach(i => i.style.width = (i.dataset.w || 0) + "%"), 50);
  } catch (e) { $("progress").textContent = "Gagal memuat progres."; }
}
loadProgress();
</script>
</body>
</html>
